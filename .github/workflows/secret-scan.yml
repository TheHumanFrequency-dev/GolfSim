name: secret scan

# A server-side backstop for the pre-commit gitleaks hook.
#
# Why this exists: until 2026-09-04 only 2 of 32 THF repos scanned in CI, so
# protection was per-MACHINE, not per-repo. A clone on any other box inherited
# nothing, and `git commit --no-verify` walked past everything with no net.
#
# Why the release binary and not gitleaks/gitleaks-action@v2: no third-party
# action in the supply chain, an explicit pinned version, and no SARIF artifact
# upload — the THF account sits at its Actions artifact-storage quota, and that
# upload fails the job even when the scan passed clean.
# (FrequencyOS's ci.yml says the action needs a paid licence for org repos.
# That is wrong and was corrected 2026-09-05: TheHumanFrequency-dev is a User
# account, not an Organization, and the action's own log says "is an individual
# user. No license key is required." The binary is still preferred, for the
# reasons above — not for the licence.)
#
# Why only the new commits and not full history: the whole estate had its first
# full-history sweep on 2026-09-04 (32 repos, 17,497 commits) and every finding
# was triaged. Rescanning that history on every push would sit permanently red
# in the repos whose known-and-accepted findings are still in the log, and a
# gate that is always red is a gate people learn to ignore. This scans what is
# being ADDED, which is the thing CI is uniquely placed to catch.
#
# Why default rules and not the custom thf-* ruleset: the custom rules live in
# ~/.githooks/gitleaks.toml, outside every repo. Committing a copy into each
# repo would duplicate one source of truth 20+ times. The defaults catch every
# live credential class (AWS, Stripe, GitHub, Telegram, JWTs, private keys);
# the three custom rules cover vendor keys for a system killed 2026-08-21 and
# stay at the pre-commit layer. Revisit if that trade stops holding.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full clone: the range being scanned may reach back several commits, and
      # a shallow clone cannot resolve the base of a PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the incoming commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          # A new branch, a force-push, or the first push to a repo gives an
          # unusable base. Fall back to the single head commit rather than
          # silently scanning nothing — exiting 0 on an unresolvable range is
          # how a gate quietly stops being a gate.
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "$ZERO" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base '${BASE_SHA:-<empty>}' unusable — scanning the head commit only"
            LOG_OPTS="--max-count=1 ${HEAD_SHA}"
          else
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          fi

          echo "scanning: ${LOG_OPTS}"
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="${LOG_OPTS}" .

      - name: What to do if this failed
        if: failure()
        run: |
          echo "A secret was found in the commits this ref adds."
          echo "Do NOT amend it away and move on — a value that reached a remote is burned."
          echo "  1. Rotate the credential at its provider FIRST."
          echo "  2. Remove it from the diff and re-push."
          echo "  3. If it is a false positive, add a fingerprint to .gitleaksignore"
          echo "     in a commit a human reviews — that is the point of the file."
